<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>SiCrecer — Sistema de Microcréditos</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Si la aplicación no arranca (script bloqueado o sin conexión), no dejar la página en blanco.
      setTimeout(function () {
        var r = document.getElementById('root')
        if (r && !r.hasChildNodes()) {
          r.innerHTML = '<div id="sicrecer-arranque" style="font-family:system-ui,sans-serif;max-width:420px;margin:15vh auto;padding:24px;text-align:center;color:#374151">'
            + '<p style="font-size:18px;font-weight:600">SiCrecer no terminó de cargar</p>'
            + '<p>Revisa tu conexión y recarga la página sin caché: <b>Cmd + Shift + R</b> en Mac o <b>Ctrl + F5</b> en Windows.</p>'
            + '<p><a href="/login" style="color:#15803d">Ir al inicio de sesión</a></p></div>'
        }
      }, 15000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
